<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />

<title>Hype &amp; Click: Algorytm Sławy — wersja testowa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff2bd6'/%3E%3Cstop offset='1' stop-color='%2322e5ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)'/%3E%3Cpath d='M36 8 18 36h12l-4 20 20-30H34z' fill='%23fff'/%3E%3C/svg%3E" />
<style>
:root{
  --bg:#07070f; --bg2:#0e0e1c; --panel:#121224; --panel2:#181833; --line:#2a2a4a;
  --txt:#f1f0ff; --mut:#9a98c3; --cyan:#22e5ff; --mag:#ff2bd6; --vio:#8b5cff; --lime:#b6ff3b; --gold:#ffd23f; --red:#ff4d6d;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Inter,system-ui,sans-serif;overscroll-behavior:none}
body{overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
  background:radial-gradient(1200px 600px at 50% -10%,#2a1050 0%,transparent 60%),radial-gradient(900px 500px at 50% 110%,#06324a 0%,transparent 60%),var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#app{position:relative;margin:0 auto;max-width:520px;height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:calc(6px + var(--sat)) calc(10px + var(--sar)) calc(4px + var(--sab)) calc(10px + var(--sal));overflow:hidden}
@media (min-width:700px){#app{border-left:1px solid #1d1d36;border-right:1px solid #1d1d36;box-shadow:0 0 80px #8b5cff22}}
/* header */
#top{display:flex;align-items:center;gap:8px;min-height:44px}
.brand{display:flex;flex-direction:column;line-height:1.05;min-width:0;flex:1}
.brand b{font-size:17px;letter-spacing:.3px;background:linear-gradient(90deg,var(--mag),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.brand small{font-size:11px;color:var(--mut);letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap}
.testbadge{font-size:9.5px;font-weight:800;letter-spacing:1px;color:#111;background:var(--gold);padding:3px 6px;border-radius:6px;white-space:nowrap;box-shadow:0 0 12px #ffd23f66}
.ibtn{min-width:38px;height:38px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:14px;font-weight:700;display:grid;place-items:center;padding:0 8px}
.ibtn:active{transform:scale(.94)}
/* stats */
#stats{text-align:center;padding:4px 0 2px}
#hype{font-size:clamp(30px,10vw,44px);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1.05;text-shadow:0 0 18px #ff2bd655}
#hypeUnit{font-size:12px;color:var(--mut);letter-spacing:2px;text-transform:uppercase}
.rates{display:flex;justify-content:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip.c{color:var(--cyan)} .chip.m{color:var(--mag)} .chip.g{color:var(--gold)}
#phase{margin:6px auto 0;font-size:11.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px}
#phase b{color:var(--lime);font-size:12px;letter-spacing:.5px}
#phase.p3 b{color:var(--gold)}
/* stage */
#stage{position:relative;flex:0 0 auto;height:clamp(170px,30vh,270px);display:grid;place-items:center}
#pubWrap{position:relative;width:min(48vw,27vh,230px);aspect-ratio:1}
#pubWrap::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:conic-gradient(from 0deg,var(--mag),var(--cyan),var(--vio),var(--mag));filter:blur(10px);opacity:.55;animation:spin 6s linear infinite}
#pub{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7ae6 0%,#c21fd0 38%,#5b1fd6 75%,#2b0f73 100%);
  box-shadow:inset 0 -10px 24px #0006,inset 0 8px 18px #ffffff33,0 10px 30px #ff2bd655;display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:transform .08s ease-out;border:3px solid #ffffff22;touch-action:none}
#pub .lbl{font-size:clamp(19px,6vw,26px);font-weight:900;letter-spacing:2px;text-shadow:0 2px 0 #0005}
#pub .sub{font-size:12px;font-weight:700;opacity:.85;margin-top:2px;font-variant-numeric:tabular-nums}
#pub .ico{font-size:clamp(22px,7vw,30px);line-height:1;margin-bottom:2px}
#pub.press{transform:scale(.9,.86)}
#pub:focus-visible{outline:3px solid var(--cyan);outline-offset:6px}
.ring{position:absolute;left:50%;top:50%;width:100%;aspect-ratio:1;border-radius:50%;border:3px solid var(--cyan);transform:translate(-50%,-50%) scale(.9);opacity:.8;pointer-events:none;animation:ring .5s ease-out forwards}
@keyframes ring{to{transform:translate(-50%,-50%) scale(1.45);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
#coach{position:absolute;left:50%;top:2px;transform:translateX(-50%);z-index:6;max-width:92%;background:#fff;color:#18102e;font-size:13px;font-weight:700;padding:8px 12px;border-radius:12px;box-shadow:0 6px 20px #0008;text-align:center;animation:bob 1.6s ease-in-out infinite;pointer-events:none}
#coach::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:7px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
/* viral */
#viralBar{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;
  background:linear-gradient(90deg,#ff2bd6,#ffd23f,#22e5ff,#ff2bd6);background-size:300% 100%;animation:slide 2s linear infinite;color:#120a20;font-weight:900;font-size:14px}
#viralBar .bar{flex:1;height:8px;border-radius:9px;background:#0004;overflow:hidden}
#viralBar .bar i{display:block;height:100%;background:#fff;width:100%}
@keyframes slide{to{background-position:300% 0}}
body.viral #app::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:40;border-radius:0;box-shadow:inset 0 0 0 3px #ff2bd6aa,inset 0 0 60px #ffd23f66;animation:hue 1.5s linear infinite}
body.viral #pubWrap::before{opacity:1;filter:blur(14px);animation-duration:1.2s}
body.viral #pub{background:radial-gradient(circle at 35% 30%,#fff3a8 0%,#ffb21f 35%,#ff2bd6 75%,#7a1fd6 100%)}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#bubble{position:absolute;z-index:30;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900;color:#3a2000;letter-spacing:.5px;
  background:radial-gradient(circle at 35% 30%,#fffbe0,#ffd23f 45%,#ff9f1c 85%);box-shadow:0 0 0 4px #ffd23f55,0 0 30px #ffd23f,0 0 60px #ff9f1c88;animation:float 2.2s ease-in-out infinite,pop .35s ease-out;touch-action:none}
#bubble span{display:block;font-size:26px;line-height:1}
@keyframes float{50%{transform:translateY(-10px) rotate(6deg)}}
@keyframes pop{from{transform:scale(0)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.fl{position:absolute;font-weight:900;font-size:20px;color:#fff;text-shadow:0 0 8px var(--mag),0 2px 0 #0008;animation:up .9s ease-out forwards;white-space:nowrap;font-variant-numeric:tabular-nums}
.fl.v{color:var(--gold);font-size:24px;text-shadow:0 0 10px #ff9f1c,0 2px 0 #0008}
@keyframes up{from{transform:translate(-50%,-50%) scale(.8);opacity:1}to{transform:translate(-50%,-140%) scale(1.15);opacity:0}}
.pt{position:absolute;width:8px;height:8px;border-radius:2px;animation:burst .9s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
/* tabs + panel */
#tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;margin-top:6px}
#tabs button{height:36px;border-radius:10px;font-size:12.5px;font-weight:800;color:var(--mut);position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
#tabs button.on{background:linear-gradient(135deg,#ff2bd633,#22e5ff22);color:var(--txt);box-shadow:inset 0 0 0 1px #ff2bd666}
#tabs button .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);display:none}
#tabs button.alert .dot{display:block}
#tabs button.pulse{animation:tp 1s ease-in-out infinite}
@keyframes tp{50%{box-shadow:inset 0 0 0 2px var(--gold),0 0 14px #ffd23f88}}
#panel{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 0 6px;overscroll-behavior:contain}
.bulk{display:flex;gap:6px;justify-content:flex-end;margin-bottom:6px;align-items:center;font-size:12px;color:var(--mut)}
.bulk button{padding:4px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-weight:800;font-size:12px}
.bulk button.on{border-color:var(--cyan);color:var(--cyan)}
.sec{font-size:11px;letter-spacing:1.5px;color:var(--mut);text-transform:uppercase;margin:8px 2px 6px;font-weight:800}
.item{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 10px;margin-bottom:7px;transition:transform .06s,border-color .2s}
.item:active{transform:scale(.985)}
.item.can{border-color:#22e5ff88;box-shadow:0 0 14px #22e5ff1f}
.item.cant{opacity:.62}
.item.max{opacity:.75;border-style:dashed}
.item.lock{opacity:.4}
.item .ic{width:42px;height:42px;flex:0 0 42px;border-radius:12px;display:grid;place-items:center;font-size:23px;background:var(--panel2)}
.item .bd{flex:1;min-width:0}
.item .nm{font-weight:800;font-size:14.5px;display:flex;gap:6px;align-items:baseline}
.item .nm em{font-style:normal;font-size:12px;color:var(--cyan);font-weight:800}
.item .ds{font-size:11.5px;color:var(--mut);margin-top:1px;line-height:1.25}
.item .ex{font-size:11.5px;color:var(--lime);margin-top:2px;font-weight:700}
.item .cs{flex:0 0 auto;text-align:right;font-weight:900;font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--gold)}
.item .cs small{display:block;font-size:10.5px;color:var(--mut);font-weight:700}
.item .own{font-size:20px;font-weight:900;color:#ffffff30;min-width:26px;text-align:right}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
.card h3{margin:0 0 6px;font-size:16px}
.card p{margin:4px 0;font-size:13px;color:var(--mut);line-height:1.4}
.big{font-size:24px;font-weight:900;color:var(--gold)}
.row{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0}
.row b{font-variant-numeric:tabular-nums}
.prog{height:10px;border-radius:9px;background:#0007;overflow:hidden;margin:6px 0;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--mag));width:0}
.btn{width:100%;padding:13px;border-radius:14px;font-weight:900;font-size:15px;letter-spacing:.5px;background:linear-gradient(135deg,var(--mag),var(--vio));box-shadow:0 6px 20px #ff2bd644;margin-top:8px}
.btn.gold{background:linear-gradient(135deg,#ffe066,#ff9f1c);color:#2a1600;box-shadow:0 6px 20px #ffd23f44}
.btn.ghost{background:var(--panel2);box-shadow:none;border:1px solid var(--line)}
.btn.danger{background:linear-gradient(135deg,#ff4d6d,#c9184a)}
.btn:disabled{opacity:.4;filter:grayscale(.6);cursor:not-allowed}
.btn:not(:disabled):active{transform:scale(.98)}
.gain{color:var(--lime)}
ul.kv{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--mut);line-height:1.5}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px}
.ach{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;font-size:12px}
.ach b{display:block;font-size:13px;margin-bottom:2px}
.ach.on{border-color:#b6ff3b88;box-shadow:0 0 12px #b6ff3b22}
.ach.off{opacity:.45}
.ach .e{font-size:20px}
footer{text-align:center;font-size:11px;color:#6f6d99;padding-top:3px}
/* modal */
#modal{position:fixed;inset:0;z-index:80;background:#05050cdd;display:grid;place-items:center;padding:calc(16px + var(--sat)) 16px calc(16px + var(--sab));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#modal[hidden],#coach[hidden],#viralBar[hidden],#bubble[hidden],#toast[hidden]{display:none}
.mbox{width:min(420px,100%);max-height:100%;overflow:auto;background:linear-gradient(180deg,#1a1a36,#11112a);border:1px solid #3a3a66;border-radius:20px;padding:18px;box-shadow:0 20px 60px #000a,0 0 40px #8b5cff33;text-align:center;animation:pop .25s ease-out}
.mbox h2{margin:4px 0 8px;font-size:21px}
.mbox p{color:var(--mut);font-size:14px;line-height:1.45;margin:6px 0}
.mbox .em{font-size:44px}
.mbox .set{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #2a2a4a;font-size:14px;text-align:left}
.mbox .set:last-of-type{border-bottom:0}
#toast{position:fixed;left:50%;top:calc(8px + var(--sat));pointer-events:none;transform:translateX(-50%);z-index:90;background:#141430;border:1px solid var(--lime);color:var(--txt);border-radius:14px;padding:9px 14px;font-size:13px;font-weight:700;box-shadow:0 8px 30px #000a,0 0 20px #b6ff3b33;max-width:92vw;text-align:center;animation:drop .3s ease-out}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}}
#glitch{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:#000;color:var(--gold);font-weight:900;font-size:22px;letter-spacing:2px;text-align:center;animation:gl .12s steps(2) infinite;padding:20px}
@keyframes gl{0%{text-shadow:3px 0 var(--mag),-3px 0 var(--cyan);transform:translate(1px,0)}100%{text-shadow:-3px 0 var(--mag),3px 0 var(--cyan);transform:translate(-1px,1px)}}
/* debug */
#dbg{position:fixed;left:calc(6px + var(--sal));bottom:calc(60px + var(--sab));z-index:99;font-size:11px}
#dbg .t{background:#300;border:1px solid #f55;color:#fbb;border-radius:8px;padding:4px 8px;font-weight:800}
#dbg .p{display:none;flex-wrap:wrap;gap:4px;width:220px;background:#1a0a0aee;border:1px solid #f55;border-radius:10px;padding:6px;margin-bottom:4px}
#dbg.open .p{display:flex}
#dbg .p button{background:#3a1010;border:1px solid #844;border-radius:6px;padding:5px 6px;color:#fdd;font-size:11px}
@media (max-height:620px){#stage{height:clamp(150px,27vh,230px)} #phase{display:none}}
@media (prefers-reduced-motion:reduce){#pubWrap::before,body.viral #app::after,#bubble,#viralBar{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><b>Hype &amp; Click</b><small data-i18n="subtitle">Algorytm Sławy</small></div>
    <span class="testbadge" data-i18n="testBadge">WERSJA TESTOWA</span>
    <button class="ibtn" id="langBtn" type="button" aria-label="Język / Language">EN</button>
    <button class="ibtn" id="muteBtn" type="button" aria-label="Dźwięk">🔊</button>
    <button class="ibtn" id="setBtn" type="button" aria-label="Ustawienia">⚙️</button>
  </header>
  <section id="stats">
    <div id="hype">0</div>
    <div id="hypeUnit" data-i18n="hypeUnit">hype</div>
    <div class="rates"><span class="chip c" id="ppsChip">+0/s</span><span class="chip m" id="tapChip">+1 / tap</span><span class="chip g" id="badgeChip" hidden>🏅 ×1</span></div>
    <div id="phase"><b id="phaseName"></b><span id="phaseHint"></span></div>
  </section>
  <section id="stage">
    <div id="coach" hidden></div>
    <div id="pubWrap"><button id="pub" type="button"><span class="ico">📣</span><span class="lbl" data-i18n="publish">PUBLIKUJ</span><span class="sub" id="pubSub">+1</span></button></div>
    <div id="viralBar" hidden><span>🔥 <span data-i18n="viral">VIRAL ×10</span></span><div class="bar"><i id="viralFill"></i></div><span id="viralT">0:00</span></div>
  </section>
  <nav id="tabs" role="tablist">
    <button type="button" data-tab="ups" class="on"><span data-i18n="tabUps">Ulepszenia</span><i class="dot"></i></button>
    <button type="button" data-tab="gens"><span data-i18n="tabGens">Generatory</span><i class="dot"></i></button>
    <button type="button" data-tab="prestige"><span data-i18n="tabPrestige">Kryzys</span><i class="dot"></i></button>
    <button type="button" data-tab="ach"><span data-i18n="tabAch">Osiągnięcia</span><i class="dot"></i></button>
  </nav>
  <main id="panel"></main>
  <footer>© 2026 Stop60 · <span data-i18n="footNote">wersja testowa · bez reklam</span></footer>
  <button id="bubble" type="button" hidden><div><span>🔥</span>VIRAL!</div></button>
</div>
<div id="fx"></div>
<div id="toast" hidden></div>
<div id="modal" hidden><div class="mbox" id="mbox"></div></div>
<script>
/*CORE-START*/
const HC_CORE = (() => {
  const CFG = {
    GROWTH: 1.15,
    OFFLINE_CAP: 8 * 3600,
    OFFLINE_EFF: 1.0,
    VIRAL_MULT: 10,
    VIRAL_BASE: 90,          // s
    VIRAL_PER_TREND: 15,     // s per 'trend' level
    BUBBLE_LIFE: 13,         // s on screen
    BUBBLE_MIN: 240, BUBBLE_MAX: 420, // s between bubbles
    BUBBLE_FIRST: [60, 90],  // very first bubble of a fresh save
    PRESTIGE_K: 8e8,         // badges_total = floor(sqrt(lifetime / K))
    BADGE_BONUS: 0.25,       // +25% everything per badge
    ACH_BONUS: 0.01,         // +1% per achievement
    MILESTONES: [10, 25, 50, 100, 150, 200, 250, 300, 400, 500],
    gens: [
      { id: 'bots',     cost: 50,     pps: 0.5 },
      { id: 'creators', cost: 600,    pps: 4 },
      { id: 'clickbait',cost: 7500,   pps: 30 },
      { id: 'farms',    cost: 90000,  pps: 220 },
      { id: 'drama',    cost: 1.1e6,  pps: 1600 },
      { id: 'memes',    cost: 1.4e7,  pps: 12000 },
      { id: 'ads',      cost: 2.0e8,  pps: 95000 },
      { id: 'ai',       cost: 3.3e9,  pps: 800000 },
    ],
    // click / meta upgrades (levelled)
    ups: [
      { id: 'title',   cost: 30,    g: 1.6,  max: 25, add: 1 },
      { id: 'thumb',   cost: 1500,  g: 1.7,  max: 25, add: 6 },
      { id: 'manager', cost: 1000,  g: 2.2,  max: 10, auto: 1 },     // auto-publish 1 tap/s per level
      { id: 'algo',    cost: 25000, g: 2.2,  max: 20, pct: 0.01 },   // each tap +1% of pps per level
      { id: 'hashtag', cost: 2e5,   g: 1.8,  max: 25, add: 40 },
      { id: 'trend',   cost: 1e5,   g: 4.0,  max: 5,  trend: 1 },    // bubbles more often, viral longer
      { id: 'collab',  cost: 5e6,   g: 30,   max: 4,  mult: 2 },     // x2 tap value
    ],
  };
  const genIndex = Object.fromEntries(CFG.gens.map((g, i) => [g.id, i]));
  const upIndex = Object.fromEntries(CFG.ups.map((u, i) => [u.id, i]));

  function newState(now) {
    return {
      v: 1, hype: 0, runEarned: 0, lifetime: 0, // lifetime = across all runs (drives badges)
      gens: CFG.gens.map(() => 0), ups: CFG.ups.map(() => 0),
      badges: 0, badgesEarned: 0, prestiges: 0,
      taps: 0, virals: 0, bubbles: 0, ach: [],
      viralLeft: 0, nextBubble: CFG.BUBBLE_FIRST[0] + Math.random() * (CFG.BUBBLE_FIRST[1] - CFG.BUBBLE_FIRST[0]),
      playTime: 0, runTime: 0, last: now || Date.now(), autoAcc: 0,
    };
  }
  const genCost = (s, i, n = 1) => {
    const g = CFG.gens[i], k = s.gens[i], r = CFG.GROWTH;

  for (const [id, e] of ACH) { const on = s.ach.includes(id); h += `<div class="ach ${on ? 'on' : 'off'}"><span class="e">${on ? e : '🔒'}</span><b>${L.ach[id][0]}</b>${L.ach[id][1]}</div>`; }
  h += `</div><div class="sec" style="margin-top:14px">${L.stats}</div><div class="card">
   <div class="row"><span>${L.stTaps}</span><b>${group(s.taps)}</b></div><div class="row"><span>${L.stTime}</span><b>${fmtDur(s.playTime)}</b></div>
   <div class="row"><span>${L.stVirals}</span><b>${s.virals}</b></div><div class="row"><span>${L.stPrest}</span><b>${s.prestiges}</b></div>
   <div class="row"><span>${L.stBest}</span><b>${fmt(s.runEarned)}</b></div><div class="row"><span>${L.stLife}</span><b>${fmt(s.lifetime)}</b></div></div>`;
  panel.innerHTML = h;
}

// ---------------- HUD update ----------------
let lastPhase = 0;
function phase() { if (C.prestigeGain(s) >= 1) return 3; if (C.lvl(s, 'manager') > 0 || s.gens.reduce((a, b) => a + b, 0) >= 10) return 2; return 1; }
function updateUI(force) {
  $('hype').textContent = fmt(s.hype);
  const auto = C.autoRate(s) * C.tapValue(s);
  $('ppsChip').textContent = '+' + fmt(C.pps(s) + auto) + L.perSec;
  $('tapChip').textContent = '+' + fmt(C.tapValue(s)) + ' ' + L.perTap;
  $('pubSub').textContent = '+' + fmt(C.tapValue(s));
  const bc = $('badgeChip'); bc.hidden = s.badges === 0; if (s.badges) bc.textContent = `🏅 ${s.badges} · ×${fmtMult(C.globalMult(s))}`;
  const ph = phase(); const pe = $('phase'); pe.className = 'p' + ph;
  $('phaseName').textContent = L['phase' + ph];
  if (ph === 1) $('phaseHint').textContent = L.phase1Hint;
  else if (ph === 2) { const need = C.lifetimeForNextBadge(s) - s.lifetime; $('phaseHint').textContent = s.badgesEarned ? L.phase2HintAfter(fmt(need) + ' hype') : L.phase2Hint(fmt(need) + ' hype'); }
  else $('phaseHint').textContent = L.phase3Hint;
  if (lastPhase && ph > lastPhase) { toast(ph === 2 ? L.phaseUp2 : L.phaseUp3, 3500); SND.ach(); }
  lastPhase = ph;
  // tabs alerts
  const tb = (t) => document.querySelector(`#tabs [data-tab=${t}]`);
  const affG = CFG.gens.some((g, i) => genVisible(i) && s.hype >= C.genCost(s, i));
  const affU = CFG.ups.some((u, i) => upVisible(i) && !C.upMaxed(s, i) && s.hype >= C.upCost(s, i));
  tb('gens').classList.toggle('alert', affG && tab !== 'gens'); tb('ups').classList.toggle('alert', affU && tab !== 'ups');
  tb('prestige').classList.toggle('pulse', ph === 3 && tab !== 'prestige'); tb('prestige').classList.toggle('alert', ph === 3);
  tb('gens').classList.toggle('pulse', s.onb === 1 && tab !== 'gens');
  // viral
  const vb = $('viralBar');
  if (s.viralLeft > 0) { vb.hidden = false; $('viralT').textContent = mmss(s.viralLeft); $('viralFill').style.width = Math.min(100, s.viralLeft / C.viralDuration(s) * 100) + '%'; document.body.classList.add('viral'); }
  else { vb.hidden = true; document.body.classList.remove('viral'); }
  if (wasViral && s.viralLeft <= 0) toast(L.viralEnd);
  wasViral = s.viralLeft > 0;
  // onboarding coach
  const co = $('coach');
  if (s.onb === 0 && s.taps >= 8) s.onb = 1;
  if (s.onb === 1 && s.gens[0] > 0) { s.onb = 2; s.onbT = 7; }
  if (s.onb === 2 && !(s.onbT > 0)) s.onb = 3;
  let msg = '';
  if (s.onb === 0) msg = L.coach0; else if (s.onb === 1 && s.hype >= CFG.gens[0].cost) msg = L.coach1; else if (s.onb === 2) msg = L.coach2;
  co.hidden = !msg || s.viralLeft > 0; if (msg) co.textContent = msg;
}
function checkAch() {
  for (const [id, , test] of ACH) if (!s.ach.includes(id) && test(s)) { s.ach.push(id); toast(`🏆 ${L.achGot} <b>${L.ach[id][0]}</b> · +1%`); SND.ach(); if (tab === 'ach') renderPanel(true); }
}

// ---------------- main loop ----------------
let lastFrame = performance.now(), uiAcc = 0, achAcc = 0, saveAcc = 0;
function handleGap(sec) {
  if (sec <= 0) return;
  if (sec >= 60) {
    const vl = s.viralLeft; s.viralLeft = 0; const r = C.offline(s, sec); s.viralLeft = Math.max(0, vl - sec);
    s.nextBubble = Math.min(s.nextBubble, 20 + Math.random() * 40);
    if (r.gain > 0) welcomeBack(r);
  } else { C.step(s, sec); }
  s.last = Date.now(); dirty = true;
}
function frame(now) {
  let dt = (now - lastFrame) / 1000; lastFrame = now;
  const wall = (Date.now() - s.last) / 1000;
  if (dt > 5 || wall > 5) { handleGap(Math.max(dt, wall)); dt = 0; }
  dt = Math.min(Math.max(dt, 0), 1);
  if (dt > 0) {
    C.step(s, dt); s.last = Date.now();
    if (s.onbT > 0) s.onbT -= dt;
    if (bubbleLeft > 0) { bubbleLeft -= dt; if (bubbleLeft <= 0) hideBubble(); }
    else if (s.viralLeft <= 0) { s.nextBubble -= dt; if (s.nextBubble <= 0) { spawnBubble(); s.nextBubble = C.bubbleInterval(s); } }
  }
  uiAcc += dt; achAcc += dt; saveAcc += dt;
  if (uiAcc > 0.1 || dirty) { uiAcc = 0; dirty = false; updateUI(); renderPanel(false); refreshItems(); }
  if (achAcc > 0.5) { achAcc = 0; checkAch(); }
  if (saveAcc > 10) { saveAcc = 0; save(); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else { lastFrame = performance.now(); } });
window.addEventListener('pagehide', save);

// ---------------- debug (only with ?debug=1) ----------------
function ff(sec) {
  C.step(s, sec); s.last = Date.now();
  if (s.viralLeft <= 0 && bubble.hidden) { s.nextBubble -= sec; if (s.nextBubble <= 0) { spawnBubble(); s.nextBubble = C.bubbleInterval(s); } }
  dirty = true; checkAch(); updateUI(true); renderPanel(true);
}
if (DEBUG) {
  window.HC = {
    C, get s() { return s; }, ff, save, load, fmt, phase, doPrestige, tap: () => { const r = pub.getBoundingClientRect(); doTap(r.left + r.width / 2, r.top + r.height / 2); },
    hideBubble, viral: () => startViral(), bubble: () => { s.nextBubble = 0; hideBubble(); spawnBubble(); },
    addHype: (x) => { C.earn(s, x); dirty = true; },
    readyPrestige: (n = 3) => { const need = Math.pow(s.badgesEarned + n, 2) * CFG.PRESTIGE_K; if (s.lifetime < need) C.earn(s, need - s.lifetime); dirty = true; renderPanel(true); },
    offlineTest: (sec) => { s.last = Date.now() - sec * 1000; LS.set(KEY, JSON.stringify(s)); suppressSave = true; location.reload(); },
    tab: (t) => document.querySelector(`#tabs [data-tab=${t}]`).click(),
  };
  const d = document.createElement('div'); d.id = 'dbg';
  d.innerHTML = `<div class="p"><button data-d="m1">+1 min</button><button data-d="m10">+10 min</button><button data-d="h1">+1 h</button><button data-d="x100">hype ×100</button><button data-d="k">+10 tys.</button><button data-d="v">viral</button><button data-d="b">bańka</button><button data-d="p">prestiż gotowy</button><button data-d="o">offline 3h</button><button data-d="r">reset</button></div><button class="t">🐞 DEBUG</button>`;
  document.body.appendChild(d);
  d.querySelector('.t').onclick = () => d.classList.toggle('open');
  d.querySelector('.p').onclick = (e) => {
    const k = e.target.dataset.d; if (!k) return;
    ({ m1: () => ff(60), m10: () => ff(600), h1: () => ff(3600), x100: () => window.HC.addHype(Math.max(1000, s.hype * 99)), k: () => window.HC.addHype(1e4), v: () => window.HC.viral(), b: () => window.HC.bubble(), p: () => window.HC.readyPrestige(3), o: () => window.HC.offlineTest(3 * 3600), r: () => { suppressSave = true; LS.del(KEY); location.reload(); } })[k]();
  };
}

// ---------------- boot ----------------
const lastSaved = load();
applyLang();
lastPhase = phase();
if (lastSaved) { const gap = (Date.now() - lastSaved) / 1000; if (gap > 5) handleGap(gap); }
s.last = Date.now();
wasViral = s.viralLeft > 0;
updateUI(true); renderPanel(true);
requestAnimationFrame((t) => { lastFrame = t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
